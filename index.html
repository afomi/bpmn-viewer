<!DOCTYPE html>
<html lang="en">
<head>
  <meta
    charset="UTF-8"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>BPMN Viewer - View and Import Business Process Models</title>
  <meta
    name="description"
    content="Free online BPMN viewer for viewing and importing .bpmn files - Business Process Model Notation diagrams."
  />
  <meta
    name="keywords"
    content="BPMN, service design, customer experience, CX, business process, process modeling, workflow, diagram viewer, bpmn-js, process models"
  />
  <meta
    name="author"
    content="https://ryanwold.net"
  />

  <!-- Open Graph / Facebook -->
  <meta
    property="og:type"
    content="website"
  />
  <meta
    property="og:url"
    content="https://afomi.github.io/bpmn-viewer/"
  />
  <meta
    property="og:title"
    content="BPMN Viewer - View and Import Business Process Models"
  />
  <meta
    property="og:description"
    content="Free online BPMN viewer for viewing and importing Business Process Model and Notation diagrams. Load .bpmn files from GitHub or create your own."
  />

  <!-- Twitter -->
  <meta
    property="twitter:card"
    content="summary_large_image"
  />
  <meta
    property="twitter:url"
    content="https://afomi.github.io/bpmn-viewer/"
  />
  <meta
    property="twitter:title"
    content="BPMN Viewer - View and Import Business Process Models"
  />
  <meta
    property="twitter:description"
    content="Free online BPMN viewer for viewing and importing Business Process Model and Notation diagrams."
  />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://afomi.github.io/bpmn-viewer/"
  />

  <!-- Tailwind CSS 4 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- bpmn-js styles -->
  <link
    rel="stylesheet"
    href="node_modules/bpmn-js/dist/assets/bpmn-js.css"
  >

  <style>
    html,
    body {
      height: 100%;
    }

    .file-item {
      width: 100%;
      text-align: left;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      transition: background-color 0.15s;
    }

    .file-item:hover {
      background-color: #f3f4f6;
    }

    .file-item.active {
      background-color: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body class="flex h-full">
  <!-- Sidebar -->
  <div class="w-64 border-r border-gray-200 bg-white flex flex-col">
    <div class="p-4 border-b border-gray-200">
      <h1 class="text-lg font-semibold text-gray-900">BPMN Viewer</h1>
      <p class="text-sm text-gray-500 mt-1">Process Models</p>
    </div>
    <div class="flex-1 overflow-y-auto flex flex-col">
      <div
        id="file-list"
      ></div>
    </div>
    <div class="border-t border-gray-200">
      <div class="p-3">
        <p class="text-xs text-gray-500">
          Create models at <a
            href="https://demo.bpmn.io/new"
            target="_blank"
            rel="noopener noreferrer"
            class="text-blue-600 hover:underline"
          >demo.bpmn.io</a>
        </p>
      </div>
      <div class="border-t border-gray-200 p-3">
        <label
          for="url-input"
          class="block text-xs font-medium text-gray-500 mb-1"
        >
          Import
        </label>
        <input
          type="text"
          id="url-input"
          placeholder="Paste GitHub raw .bpmn URL"
          class="w-full px-2 py-1.5 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
        <button
          id="load-url-btn"
          class="w-full mt-2 px-2 py-1.5 text-xs bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors"
        >
          Load from URL
        </button>
      </div>
    </div>
    <a
      href="https://github.com/afomi/bpmn-viewer"
      target="_blank"
      rel="noopener noreferrer"
      class="p-3 border-t border-gray-200 text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors flex items-center justify-center"
      title="View on GitHub"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 16 16"
        fill="currentColor"
      >
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>

  <!-- Canvas -->
  <div
    id="canvas"
    class="flex-1 h-full"
  ></div>

  <script src="dist/app.js"></script>
</body>
</html>
